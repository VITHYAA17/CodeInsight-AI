services:
  - type: web
    name: codeinsight-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: codeinsight-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: codeinsight-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: codeinsight-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080

  - type: web
    name: codeinsight-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://codeinsight-ai-backend-ncxn.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: codeinsight-db
    plan: free
    databaseName: codeinsight
