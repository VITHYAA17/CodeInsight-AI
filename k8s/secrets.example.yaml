apiVersion: v1
kind: Secret
metadata:
  name: codeinsight-secrets
  namespace: codeinsight
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "codeinsight_user"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"
  JWT_SECRET: "your-super-secret-jwt-key-with-at-least-32-characters"
  OPENAI_API_KEY: "sk-proj-YOUR_OPENAI_API_KEY"
