apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeinsight-backend
  namespace: codeinsight
  labels:
    app: codeinsight-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codeinsight-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: codeinsight-backend
        tier: api
    spec:
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/codeinsight-ai-production/codeinsight-docker-prod/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: codeinsight-config
            - secretRef:
                name: codeinsight-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
