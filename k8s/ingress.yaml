apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codeinsight-ingress
  namespace: codeinsight
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "codeinsight-ssl-cert"
spec:
  rules:
    - host: codeinsight.ai
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codeinsight-backend-svc
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codeinsight-frontend-svc
                port:
                  number: 80
