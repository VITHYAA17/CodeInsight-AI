apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeinsight-frontend
  namespace: codeinsight
  labels:
    app: codeinsight-frontend
    tier: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codeinsight-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: codeinsight-frontend
        tier: ui
    spec:
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/codeinsight-ai-production/codeinsight-docker-prod/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
