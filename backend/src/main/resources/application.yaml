spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codeinsight}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:CodeInsight@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      data-source-properties:
        sslmode: ${SSL_MODE:prefer}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 1800000
      cache-null-values: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.security: WARN
    root: INFO

jwt:
  secret: ${JWT_SECRET:MySuperSecretKeyForCodeInsightAIApplication2026MySuperSecretKey}
  expiration: 86400000
